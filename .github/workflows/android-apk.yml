# Builds a sideloadable Android release APK in the cloud (no local JDK/Android SDK needed).
# The APK is signed with the Expo template debug keystore: hackathon/demo sideloading only,
# not dApp Store production signing. See docs/BUILD_ENVIRONMENT.md.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: npm ci

      # tsc --noEmit, lint:check, format:check, expo prebuild -p android (generates android/)
      - name: Checks and prebuild
        run: npm run ci

      - name: Offline verifiers
        run: |
          npm run verify:scanner
          npm run verify:revoke
          npm run verify:flow

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: guardrail-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
