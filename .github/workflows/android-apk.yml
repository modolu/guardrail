# Builds a sideloadable Android release APK in the cloud (no local JDK/Android SDK needed).
# The APK is signed with the Expo template debug keystore: hackathon/demo sideloading only,
# not dApp Store production signing. See docs/BUILD_ENVIRONMENT.md.
name: Android APK

on:
  workflow_dispatch:
    # Optional Devnet demo setup build (docs/DEMO.md). Leave both empty for a normal build. Public addresses only.
    inputs:
      demo_mint:
        description: 'EXPO_PUBLIC_DEMO_MINT for a Devnet demo setup build (empty = normal build)'
        required: false
        default: ''
      demo_delegate:
        description: 'EXPO_PUBLIC_DEMO_DELEGATE for a Devnet demo setup build (empty = normal build)'
        required: false
        default: ''
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: npm ci

      # tsc --noEmit, lint:check, format:check, expo prebuild -p android (generates android/)
      - name: Checks and prebuild
        run: npm run ci

      - name: Offline verifiers
        run: |
          npm run verify:scanner
          npm run verify:revoke
          npm run verify:flow
          npm run verify:demo-approve

      # Manual runs with demo inputs only. Push builds never set these, so the demo setup panel stays off.
      - name: Enable Devnet demo setup
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.demo_mint != '' || inputs.demo_delegate != '') }}
        env:
          DEMO_MINT: ${{ inputs.demo_mint }}
          DEMO_DELEGATE: ${{ inputs.demo_delegate }}
        run: |
          base58='^[1-9A-HJ-NP-Za-km-z]{32,44}$'
          if [[ ! "$DEMO_MINT" =~ $base58 || ! "$DEMO_DELEGATE" =~ $base58 ]]; then
            echo "demo_mint and demo_delegate must both be base58 addresses"
            exit 1
          fi
          {
            echo "EXPO_PUBLIC_DEMO_SETUP=1"
            echo "EXPO_PUBLIC_DEMO_MINT=$DEMO_MINT"
            echo "EXPO_PUBLIC_DEMO_DELEGATE=$DEMO_DELEGATE"
          } >> "$GITHUB_ENV"

      # Demo target is Solana Mobile/Seeker (arm64), so build only arm64-v8a instead of the four ABIs in the
      # generated gradle.properties. The APK still bundles the JS and runs standalone. Not a universal store build.
      - name: Build release APK (arm64-v8a)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.EXPO_PUBLIC_DEMO_SETUP == '1' && 'guardrail-demo-setup-apk' || 'guardrail-release-apk' }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
